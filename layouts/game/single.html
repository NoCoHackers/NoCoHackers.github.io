<!DOCTYPE html>
<html lang="{{ $.Site.Language }}">
<head>
  <title>Bun Run :: {{ $.Site.Title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bun Run - A NoCo Hackers game">
  <link rel="shortcut icon" href="{{ "favicon.ico" | absURL }}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ff88;
      text-decoration: none;
      font-size: 16px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    #gameContainer {
      position: relative;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    }

    #gameCanvas {
      display: block;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      border: 3px solid #00ff88;
      border-radius: 8px;
      max-width: 100vw;
    }

    #scoreDisplay {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #00ff88;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font-size: 20px;
      text-align: center;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
      pointer-events: none;
      white-space: pre-line;
      line-height: 1.5;
    }

    @media (max-width: 1000px) {
      #gameCanvas {
        width: 100vw;
        height: auto;
      }

      #scoreDisplay {
        font-size: 18px;
        top: 10px;
        right: 10px;
      }

      #message {
        font-size: 16px;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <a href="/" class="back-link">[← back to site]</a>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="400"></canvas>
    <div id="scoreDisplay">SCORE: 0</div>
    <div id="message">PRESS SPACE OR TAP TO START</div>
  </div>
  <script src="{{ "game/game.js" | absURL }}"></script>
</body>
</html>
